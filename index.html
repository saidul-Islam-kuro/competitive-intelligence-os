<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>SignalOS — Competitive Intelligence</title>
<style>
:root{--bg:#080a0f;--panel:#0f131b;--panel2:#131923;--line:#202735;--text:#eef2f7;--muted:#8d98aa;--red:#ef4444;--red2:#fb7185;--green:#34d399;--amber:#fbbf24;--blue:#60a5fa;--shadow:0 18px 50px #0007}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#080a0f,#0b0f17 55%,#090b10);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 20px;border:1px solid var(--line);background:#0c1017dd;backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:5}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#ef4444,#991b1b);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 24px #ef444433}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#121720;color:var(--text);padding:9px 13px;border-radius:10px;transition:.18s}.btn:hover{border-color:#3b4557;transform:translateY(-1px)}.primary{background:var(--red);border-color:var(--red);font-weight:700}.primary:hover{background:#f05252}.ghost{background:transparent}.shell{display:grid;grid-template-columns:240px 1fr;gap:18px;margin-top:18px}.sidebar{height:max-content;position:sticky;top:104px;border:1px solid var(--line);background:#0d1118;border-radius:16px;padding:10px}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:#aab4c4;padding:11px 12px;border-radius:9px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#171d27;color:#fff}.navlabel{font-size:10px;color:#667184;text-transform:uppercase;letter-spacing:.12em;padding:12px}.content{min-width:0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:4px 0 18px}.hero h2{font-size:30px;letter-spacing:-.03em;margin:0 0 7px}.hero p{color:var(--muted);margin:0;max-width:700px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{border:1px solid var(--line);background:linear-gradient(180deg,#121722,#0d1118);border-radius:14px;padding:15px}.stat small{color:var(--muted)}.num{font-size:25px;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#11161f,#0d1118);border-radius:15px;padding:17px}.card h3,.card h2{margin:0 0 8px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap}.search{background:#0b0f15;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#fff;min-width:240px}.competitor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);background:#0c1118;border-radius:12px;margin-top:8px}.avatar{width:36px;height:36px;border-radius:10px;background:#1c2430;display:grid;place-items:center;font-weight:800}.compmeta{display:flex;align-items:center;gap:11px;min-width:0}.compmeta>div:last-child{min-width:0}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:#171e2a;color:#b7c1d1;font-size:11px;border:1px solid #263041}.pill.red{color:#fecaca;background:#2a1217;border-color:#4a2028}.pill.green{color:#a7f3d0;background:#0d251e;border-color:#174936}.pill.amber{color:#fde68a;background:#2a2110;border-color:#4a3913}.feed{display:grid;gap:8px}.change{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0c1118}.changeTop{display:flex;justify-content:space-between;gap:10px}.bar{height:7px;background:#171d27;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #293241;border-radius:12px}.field{display:flex;flex-direction:column;gap:6px;flex:1}.field label{font-size:12px;color:#9da8b8}.field input,.field select,.field textarea{width:100%;background:#0a0e14;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4b5563}.row{display:flex;gap:10px;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:10px;background:#111925;border:1px solid var(--line);color:#b9c4d4}.notice.success{border-color:#174936;color:#a7f3d0}.notice.danger{border-color:#5a222b;color:#fecaca}.modal{display:none;position:fixed;inset:0;background:#000a;backdrop-filter:blur(7px);z-index:20;place-items:center;padding:18px}.modal.open{display:grid}.modalbox{max-width:760px;width:100%;max-height:88vh;overflow:auto;background:#0e131b;border:1px solid #2a3444;border-radius:18px;padding:20px;box-shadow:0 30px 100px #000b}.close{float:right;background:#171d27;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 9px}.code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#080b10;border:1px solid var(--line);padding:12px;border-radius:10px;white-space:pre-wrap;overflow:auto}.metricrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{padding:12px;background:#0b1017;border:1px solid var(--line);border-radius:11px}.mini b{display:block;font-size:18px;margin-top:3px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link{color:#c7d2fe;text-decoration:none}.link:hover{text-decoration:underline}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto}.navlabel{display:none}.navbtn{width:auto;white-space:nowrap}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.app{padding:12px}.topbar{position:static}.hero{display:block}.hero .actions{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.split,.metricrow{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">S</div><div><h1>SignalOS</h1><p>Algorithm-first competitive intelligence</p></div></div><div class="actions"><button class="btn" onclick="runAll()">↻ Run monitoring</button><button class="btn primary" onclick="openAdd()">＋ Add competitor</button></div></header>
<div class="shell"><aside class="sidebar"><div class="navlabel">Workspace</div><button class="navbtn active" data-tab="overview" onclick="home()">Overview</button><button class="navbtn" data-tab="trends" onclick="trends()">Trends</button><button class="navbtn" data-tab="research" onclick="research()">AI Research</button><button class="navbtn" data-tab="reports" onclick="reports()">Reports</button><div class="navlabel">System</div><button class="navbtn" data-tab="integrations" onclick="integrations()">Alerts & API</button><button class="navbtn" onclick="aboutEngine()">How analysis works</button></aside><main class="content"><div id="notice"></div><div id="view"></div></main></div></div>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let products=[];
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r.status===204?null:r.json()}
function note(msg,type=''){ $('#notice').innerHTML=msg?`<div class="notice ${type}" style="margin-bottom:12px">${esc(msg)}</div>`:'';if(msg)setTimeout(()=>$('#notice').innerHTML='',5000)}
function active(tab){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}
async function load(){products=await api('/api/products');const stats=await api('/api/dashboard/stats');const changes=await api('/api/dashboard/recent-changes?limit=8');renderHome(stats,changes)}
function renderHome(s,changes){active('overview');$('#view').innerHTML=`<section class="hero"><div><h2>Competitive intelligence, without the AI bill.</h2><p>Monitor websites, detect product and pricing changes, score reviews, surface trends, generate reports and expose the data through an API. AI is optional.</p></div></section><div class="stats">${[['Competitors',s.products],['Changes',s.changes],['Pricing points',s.pricing],['Reviews',s.reviews],['Snapshots',s.snapshots],['Reports',s.reports]].map(x=>`<div class="stat"><small>${x[0]}</small><div class="num">${x[1]}</div></div>`).join('')}</div><div class="grid2"><div class="card"><div class="toolbar"><div><h3>Monitored competitors</h3><span class="muted">Deterministic monitoring runs from your configured URLs.</span></div><input class="search" id="search" placeholder="Search competitors…" oninput="filterComps()"></div><div id="comps">${compHtml(products)}</div></div><div class="card"><h3>Engine status</h3><div class="metricrow"><div class="mini"><span class="muted">Core analysis</span><b>100% local logic</b></div><div class="mini"><span class="muted">AI</span><b>${s.serverAI?'Server enabled':'Optional'}</b></div><div class="mini"><span class="muted">Scheduler</span><b>Active</b></div></div><p class="muted" style="margin-top:14px">Pricing uses regex + normalization. Changes use text diff + rule classification. Reviews use a deterministic sentiment lexicon and topic matcher.</p><button class="btn" onclick="aboutEngine()">View methodology</button></div></div><div class="card" style="margin-top:12px"><div class="toolbar"><div><h3>Recent signals</h3><span class="muted">Newest detected changes across your watchlist.</span></div></div><div class="feed">${changes.length?changes.map(changeCard).join(''):'<div class="empty">No signals yet. Add a competitor and run monitoring.</div>'}</div></div>`}
function compHtml(list){return list.length?list.map(p=>`<div class="competitor"><div class="compmeta"><div class="avatar">${esc(p.name[0]||'?').toUpperCase()}</div><div><b>${esc(p.name)}</b><div class="muted ellipsis">${esc(p.homepageUrl)}</div></div></div><div class="actions"><span class="pill">${p._count?.changes||0} changes</span><button class="btn" onclick="showProduct('${p.id}')">Open</button></div></div>`).join(''):'<div class="empty">No competitors configured.</div>'}
function filterComps(){const q=$('#search').value.toLowerCase();$('#comps').innerHTML=compHtml(products.filter(p=>(p.name+' '+p.homepageUrl).toLowerCase().includes(q)))}
function changeCard(c){const cls=c.category==='pricing'||c.category==='deprecation'?'red':c.category==='feature'?'green':'amber';return `<div class="change"><div class="changeTop"><div><b>${esc(c.product.name)}</b> <span class="pill ${cls}">${esc(c.category)}</span></div><span class="muted">${new Date(c.detectedAt).toLocaleString()}</span></div><div style="margin-top:7px">${esc(c.summary)}</div><div class="muted" style="margin-top:4px">${esc(c.detail||'')}</div></div>`}
async function showProduct(id){const d=await api('/api/products/'+id);$('#view').innerHTML=`<div class="hero"><div><h2>${esc(d.name)}</h2><p><a class="link" href="${esc(d.homepageUrl)}" target="_blank" rel="noreferrer">${esc(d.homepageUrl)}</a></p></div><div class="actions"><button class="btn" onclick="scrape('${d.id}')">Monitor now</button><button class="btn" onclick="deleteProduct('${d.id}')">Delete</button></div></div><div class="stats">${[['Changes',d.changes.length],['Snapshots',d.snapshots.length],['Pricing',d.pricingPoints.length],['Reviews',d.reviews.length],['Review sources',d.reviewSources.length],['Engine','No-AI']].map(x=>`<div class="stat"><small>${x[0]}</small><div class="num" style="font-size:${typeof x[1]==='string'?'18':'25'}px">${x[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Change timeline</h3><div class="feed">${d.changes.length?d.changes.map(changeCard).join(''):'<div class="empty">No changes recorded.</div>'}</div></div><div class="card" style="margin-top:12px"><h3>Pricing history</h3>${d.pricingPoints.length?`<table class="table"><tr><th>Plan</th><th>Price</th><th>Billing</th><th>Captured</th></tr>${d.pricingPoints.map(x=>`<tr><td>${esc(x.planName)}</td><td>${x.price==null?'Custom':esc(x.price+' '+(x.currency||''))}</td><td>${esc(x.billingPeriod||'—')}</td><td>${new Date(x.capturedAt).toLocaleDateString()}</td></tr>`).join('')}</table>`:'<div class="empty">No pricing plans detected yet.</div>'}</div>`}
async function scrape(id){note('Monitoring competitor…');try{const r=await api('/api/products/'+id+'/scrape',{method:'POST',body:'{}'});note(`Done — ${r.result.changesDetected} changes and ${r.result.reviewsStored} new reviews.`,`success`);await load();await showProduct(id)}catch(e){note(e.message,'danger')}}
async function runAll(){note('Running deterministic monitoring for all competitors…');try{const r=await api('/api/dashboard/run-now',{method:'POST',body:'{}'});const errors=r.flatMap(x=>x.errors||[]);note(errors.length?`Completed with ${errors.length} warning(s).`:'Monitoring run complete.','success');await load()}catch(e){note(e.message,'danger')}}
function openAdd(){openModal(`<h2>Add competitor</h2><p class="muted">The engine needs only public URLs. AI keys are not required.</p><div class="row"><div class="field"><label>Name</label><input id="pn"></div><div class="field"><label>Homepage URL</label><input id="ph" placeholder="https://example.com"></div></div><div class="row" style="margin-top:10px"><div class="field"><label>Changelog / release notes URL</label><input id="pc" placeholder="https://example.com/changelog"></div><div class="field"><label>Pricing URL</label><input id="pp" placeholder="https://example.com/pricing"></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addProduct()">Add competitor</button></div>`)}
async function addProduct(){try{const p=await api('/api/products',{method:'POST',body:JSON.stringify({name:$('#pn').value,homepageUrl:$('#ph').value,changelogUrl:$('#pc').value||null,pricingUrl:$('#pp').value||null})});closeModal();await load();await scrape(p.id)}catch(e){note(e.message,'danger')}}
async function deleteProduct(id){if(!confirm('Delete competitor and its history?'))return;await api('/api/products/'+id,{method:'DELETE'});await load()}
async function trends(){active('trends');const d=await api('/api/intelligence/trends?days=30');$('#view').innerHTML=`<div class="hero"><div><h2>Cross-competitor trends</h2><p>Aggregated, explainable signals. No model required.</p></div></div><div class="card"><div class="muted">Last ${d.days} days · ${d.totalChanges} detected changes</div>${d.trends.length?d.trends.map(x=>`<div style="margin-top:15px"><div class="toolbar"><b>${esc(x.category)}</b><span class="muted">${x.count} changes · ${x.competitorCount} competitors</span></div><div class="bar"><i style="width:${Math.min(100,x.count/Math.max(1,d.totalChanges)*100)}%"></i></div><div class="muted" style="margin-top:6px">${x.competitors.map(esc).join(', ')}</div></div>`).join(''):'<div class="empty" style="margin-top:12px">Not enough data yet.</div>'}</div>`}
function aiFields(prefix='ai'){return `<div class="split"><div class="field"><label>Provider</label><select id="${prefix}p"><option value="gemini">Gemini — free key supported</option><option value="openrouter">OpenRouter</option><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select></div><div class="field"><label>Model (optional)</label><input id="${prefix}m" placeholder="Gemini default: gemini-2.0-flash"></div></div><div class="field" style="margin-top:9px"><label>API key · used for this request only</label><input id="${prefix}k" type="password" placeholder="Paste your key"></div>`}
function research(){active('research');$('#view').innerHTML=`<div class="hero"><div><h2>Optional AI research</h2><p>The database and deterministic engine work without AI. Add a Gemini or other provider key only when you want natural-language synthesis.</p></div></div><div class="card"><div class="field"><label>Research question</label><textarea id="rq" rows="5" placeholder="What changed across competitors in the last 90 days, and which pricing patterns are visible?"></textarea></div><div class="row" style="margin-top:9px"><div class="field" style="max-width:160px"><label>Period</label><input id="rd" type="number" value="90"></div></div>${aiFields('r')}<button class="btn primary" style="margin-top:12px" onclick="askResearch()">Run AI synthesis</button><div id="answer" style="margin-top:14px"></div></div>`}
async function askResearch(){try{note('Running optional AI synthesis…');const r=await api('/api/intelligence/research',{method:'POST',body:JSON.stringify({question:$('#rq').value,days:Number($('#rd').value),provider:$('#rp').value,apiKey:$('#rk').value,model:$('#rm').value||undefined})});$('#answer').innerHTML=`<div class="code">${esc(r.answer)}</div>`;note('AI synthesis complete.','success')}catch(e){note(e.message,'danger')}}
async function reports(){active('reports');const rs=await api('/api/intelligence/reports');$('#view').innerHTML=`<div class="hero"><div><h2>Reports</h2><p>Generate factual briefs directly from collected data. AI enhancement is optional.</p></div><button class="btn primary" onclick="generateReport()">Generate report</button></div><div class="feed">${rs.length?rs.map(r=>`<div class="card"><div class="toolbar"><div><b>${esc(r.title)}</b><div class="muted">${new Date(r.periodStart).toLocaleDateString()} → ${new Date(r.periodEnd).toLocaleDateString()}</div></div><button class="btn" onclick="viewReport('${r.id}')">Open</button></div></div>`).join(''):'<div class="empty">No reports yet.</div>'}</div>`}
function generateReport(){openModal(`<h2>Generate report</h2><div class="field"><label>Title</label><input id="rt" value="Weekly Competitive Intelligence Brief"></div><div class="field" style="margin-top:8px"><label>Days</label><input id="rdays" type="number" value="7"></div><p class="muted">Leave the AI key blank to generate a deterministic report.</p>${aiFields('g')}<div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doReport()">Generate</button></div>`)}
async function doReport(){try{const body={title:$('#rt').value,days:Number($('#rdays').value)};if($('#gk').value){body.provider=$('#gp').value;body.apiKey=$('#gk').value;body.model=$('#gm').value||undefined}const r=await api('/api/intelligence/reports',{method:'POST',body:JSON.stringify(body)});closeModal();await reports();viewReport(r.id)}catch(e){note(e.message,'danger')}}
async function viewReport(id){const r=await api('/api/intelligence/reports/'+id);openModal(`<h2>${esc(r.title)}</h2><div class="muted">${new Date(r.periodStart).toLocaleDateString()} → ${new Date(r.periodEnd).toLocaleDateString()}</div><div class="code" style="margin-top:12px">${esc(r.content)}</div>`)}
async function integrations(){active('integrations');const hooks=await api('/api/intelligence/webhooks');$('#view').innerHTML=`<div class="hero"><div><h2>Alerts & API</h2><p>Connect the deterministic engine to Discord, Slack, n8n, Zapier or your own service.</p></div></div><div class="grid2"><div class="card"><h3>Webhooks</h3><div class="row"><div class="field"><label>Name</label><input id="wn"></div><div class="field"><label>Webhook URL</label><input id="wu" placeholder="https://…"></div><button class="btn primary" onclick="addHook()">Add</button></div><div style="margin-top:14px">${hooks.map(h=>`<div class="competitor"><div><b>${esc(h.name)}</b><div class="muted">${esc(h.url)}</div></div><button class="btn" onclick="delHook('${h.id}')">Remove</button></div>`).join('')||'<div class="empty">No integrations.</div>'}</div></div><div class="card"><h3>Read API</h3><p class="muted">Expose collected intelligence to other apps.</p><div class="code">GET /api/v1/competitors
GET /api/v1/changes?limit=100
GET /api/v1/pricing?limit=200
GET /api/v1/trends?days=30
GET /api/v1/openapi.json</div><p class="muted">Set PUBLIC_API_KEY on the server to protect these endpoints.</p></div></div>`}
async function addHook(){try{await api('/api/intelligence/webhooks',{method:'POST',body:JSON.stringify({name:$('#wn').value,url:$('#wu').value})});await integrations()}catch(e){note(e.message,'danger')}}async function delHook(id){await api('/api/intelligence/webhooks/'+id,{method:'DELETE'});await integrations()}
function aboutEngine(){openModal(`<h2>How SignalOS analyzes data</h2><div class="feed"><div class="card"><b>1 · Change detection</b><p class="muted">Normalize page text, hash snapshots, then compare meaningful lines. Added and removed lines are classified with transparent rules.</p></div><div class="card"><b>2 · Feature intelligence</b><p class="muted">Headings, links, buttons, integration terms and release language are detected from page content. No model call is required.</p></div><div class="card"><b>3 · Pricing intelligence</b><p class="muted">Currency symbols, numeric prices, billing periods and custom-plan phrases are extracted with regex and normalization, then stored as historical points.</p></div><div class="card"><b>4 · Review intelligence</b><p class="muted">A weighted positive/negative lexicon produces a -1 to +1 sentiment score. Topic dictionaries cover pricing, performance, UI, bugs, support, integrations, security, AI and mobile.</p></div><div class="card"><b>5 · Trends & reports</b><p class="muted">Counts, competitor coverage, sentiment aggregates and pricing observations are computed directly from Supabase/Postgres.</p></div><div class="card"><b>6 · Optional AI</b><p class="muted">Gemini, OpenRouter, Anthropic and OpenAI can synthesize collected evidence. Request keys are not stored by the dashboard.</p></div></div>`)}
function openModal(h){$('#modalContent').innerHTML=h;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
function home(){load()} load();
</script></body></html>
